name: Build PSP homebrew

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    env:
      PSPDEV: /opt/pspdev
      PSPSDK: /opt/pspdev/psp/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify PSPSDK installation
        run: |
          echo "PSPDEV=$PSPDEV"
          echo "PSPSDK=$PSPSDK"
          test -f "$PSPSDK/lib/build.mak"

      - name: Compile EBOOT.PBP
        run: |
          make clean || true
          make

      - name: Upload PSP executable
        uses: actions/upload-artifact@v4
        with:
          name: Soba-Ultimato-PSP
          path: |
            EBOOT.PBP
            SobaUltimato.prx
          if-no-files-found: error
